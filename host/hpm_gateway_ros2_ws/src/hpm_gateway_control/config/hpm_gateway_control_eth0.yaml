hpm_gateway_control_node:
  ros__parameters:
    # RDK X5 EtherCAT port observed with `ip link`: eth0.
    start_ethercat: true
    arm_all_axes: true
    interface_name: eth0
    cycle_us: 1000
    rx_timeout_us: 500
    command_timeout_ms: 100
    rt_priority: 0
    # Pin the EtherCAT worker thread to this CPU core (>=0) or leave unset (-1).
    # Combine with rt_priority>0 for hard real-time; pick a core not used by
    # the ROS executor. Example for RDK X5: rt_cpu: 3, rt_priority: 80.
    rt_cpu: -1
    feedback_publish_hz: 200.0
    command_topic: /hpm_gateway/motor_command
    aggregate_command_topic: /hpm_gateway/motor_commands
    feedback_topic: /hpm_gateway/motor_feedback
    imu_topic: /imu/data
    temperature_topic: /imu/temperature
    imu_frame_id: imu_link
