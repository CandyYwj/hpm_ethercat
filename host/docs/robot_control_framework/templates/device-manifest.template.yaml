schema_version: 1
robot_id: robot-r01
device_uid: vendor.product.serial-001
semantic_name: arm/joint_1
class: actuator/joint
identity:
  vendor: TODO
  product: TODO
  serial: TODO
  firmware: ">=1.0,<2.0"
transport:
  kind: can
  bus: can0
  bitrate: 1000000
  id: 1
  id_format: standard
protocol: com.example.vendor.protocol@1
capabilities:
  - position
  - velocity
  - effort
  - enable
signals:
  position:
    type: float32
    unit: rad
    range: [-3.14, 3.14]
    freshness_ms: 5
  velocity:
    type: float32
    unit: rad/s
    range: [-10.0, 10.0]
  effort:
    type: float32
    unit: N*m
    range: [-5.0, 5.0]
timing:
  period_us: 1000
  phase_us: 0
  tx_frames: 1
  rx_frames: 1
  deadline_us: 800
  priority: 20
safety:
  startup: disabled
  command_timeout_ms: 100
  stale_action: safe_stop
  fault_action: latch_until_reset
  max_velocity: 5.0
  max_effort: 3.0
calibration:
  direction: 1
  gear_ratio: 1.0
  position_offset_rad: 0.0
  revision: TODO
ros2_control:
  joint: arm_joint_1
  command_interfaces: [position, velocity, effort]
  state_interfaces: [position, velocity, effort]
diagnostics:
  required: [feedback_age, fault_bits, tx_count, rx_count, error_count]
