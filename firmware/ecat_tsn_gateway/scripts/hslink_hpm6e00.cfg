# HSLINK (CMSIS-DAP v2) configuration for the HPM6E80 full-port board.
# The CMSIS-DAP probe and HPM6E80 board definitions are supplied by OpenOCD.
source [find probes/cmsis_dap.cfg]
source [find soc/hpm6e80-single-core.cfg]
source [find boards/hpm6e00evk.cfg]

# Halt on debugger attach so firmware state cannot change during inspection.
$_TARGET0 configure -event gdb-attach {
    halt
}
